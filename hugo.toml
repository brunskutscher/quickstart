baseURL = 'https://example.org/'
locale = 'de-DE'
title = ' Tischtennis SGS Erlangen'
#title = 'Tischtennis in der Sportgemeinschaft Siemens Erlangen e.V.'
#theme = 'hugo-universal-theme'
theme = 'ananke'
#theme = 'congo'
defaultContentLanguage='de'
description="<Site Description>Tischtennis in der Sportgemeinschaft Siemens e.V."


[markup.goldmark.renderer]  # render iframe
  unsafe = true

[params]
  background_color_class = "bg-blue pb1-m pb3-l" #(blue and smaller)
  site_logo = "img/SGS_Logo_100_100.svg"
  #date_format="1965-01-23"
  header_section_class = "tc-l pv3 ph3 ph4-ns" # make the header (site-header) smaller
  featured_image_class = "cover bg-center" # align the image so it will not be strechted


[params.ananke]
  show_recent_posts = false
  show_categories = true
  custom_css = ["css/custom.css"]

[params.congo]
  colorScheme = 'sapphire'

[menus]

